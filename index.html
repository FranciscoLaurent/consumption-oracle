<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消费预言机 · 7天后见</title>
<style>
/* ============ tokens ============ */
:root{
  --paper:#F6F1E4; --ink:#151515; --purple:#6C3BD1; --purple-d:#4B2694;
  --neon:#C8F31D; --red:#D62828; --yellow:#FFD400; --gray:#8A857A;
  --card:#FFFDF6; --serif:"Songti SC","STSong","SimSun",serif;
  --din:"Bahnschrift","DIN Alternate","Consolas",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#111114;color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
body::before{content:'';position:fixed;inset:0;
  background:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:36px 36px;pointer-events:none}
/* ============ phone shell ============ */
.phone{width:390px;height:844px;background:var(--paper);border-radius:46px;
  border:10px solid #000;box-shadow:0 34px 90px rgba(0,0,0,.65),0 0 0 1px #333;
  position:relative;overflow:hidden;flex:none}
@media(max-width:480px),(max-height:900px){
  body{align-items:stretch}
  .phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-family:var(--din);font-size:13px;font-weight:700;
  background:var(--paper);position:relative;z-index:5}
.statusbar .brand{font-family:var(--serif);letter-spacing:1px;font-size:12px;color:var(--ink)}
.screens{position:absolute;top:44px;bottom:62px;left:0;right:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;
  padding:14px 15px 26px;background:var(--paper);
  background-image:radial-gradient(rgba(21,21,21,.05) 1px,transparent 1px);background-size:9px 9px}
.screen.active{display:block;animation:slidein .24s ease}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ============ tabbar ============ */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:62px;background:var(--card);
  border-top:2px solid var(--ink);display:flex;z-index:6}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;color:var(--gray);cursor:pointer;user-select:none}
.tab .ico{font-size:20px;line-height:1}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .ico{filter:drop-shadow(2px 2px 0 rgba(108,59,209,.35))}
.tab.on::after{content:'';width:22px;height:4px;background:var(--purple);border-radius:2px;margin-top:1px}
/* ============ atoms ============ */
.h1{font-family:var(--serif);font-size:25px;line-height:1.3;letter-spacing:1px}
.h2{font-family:var(--serif);font-size:17px;letter-spacing:.5px}
.num{font-family:var(--din);font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border:1.5px solid var(--ink);
  border-radius:20px;background:#fff;letter-spacing:.5px;vertical-align:middle}
.tag.pu{background:var(--purple);color:#fff;border-color:var(--purple-d)}
.tag.rd{background:var(--red);color:#fff;border-color:var(--ink)}
.tag.ne{background:var(--neon)}
.tag.ye{background:var(--yellow)}
.note{font-size:10.5px;color:var(--gray);line-height:1.6}
.btn{display:block;width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--card);
  padding:13px 16px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;
  box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;user-select:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pu{background:var(--purple);color:#fff}
.btn.rd{background:var(--red);color:#fff}
.btn.ne{background:var(--neon)}
.btn.ye{background:var(--yellow)}
.btn.sm{padding:9px 12px;font-size:13.5px;box-shadow:3px 3px 0 var(--ink);border-radius:10px}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed;color:var(--gray);font-weight:600}
.btn.ghost:active{transform:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-block;padding:7px 12px;border:1.5px solid var(--ink);border-radius:20px;
  background:#fff;font-size:12.5px;margin:0 8px 8px 0;cursor:pointer;user-select:none}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple-d)}
.chip.ne.on{background:var(--neon);color:var(--ink);border-color:var(--ink)}
.ticket{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:14px;
  box-shadow:5px 5px 0 var(--ink);padding:16px}
.ticket.cut::before,.ticket.cut::after{content:'';position:absolute;width:18px;height:18px;
  border-radius:50%;background:var(--paper);border:2px solid var(--ink);top:50%;margin-top:-11px}
.ticket.cut::before{left:-12px}.ticket.cut::after{right:-12px}
.hazard{height:11px;border:1.5px solid var(--ink);
  background:repeating-linear-gradient(45deg,var(--yellow) 0 11px,var(--ink) 11px 22px)}
.divider{border-top:2px dashed rgba(21,21,21,.35);margin:13px 0}
.row{display:flex;align-items:center;gap:8px}
.bar{height:14px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;display:flex;background:#fff}
.bar i{display:block;height:100%}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.field input,.field textarea{width:100%;border:2px solid var(--ink);border-radius:10px;background:#fff;
  padding:11px 12px;font-size:15.5px;font-family:inherit;outline:none}
.field input:focus,.field textarea:focus{box-shadow:3px 3px 0 var(--purple)}
.backbtn{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;cursor:pointer;
  border:2px solid var(--ink);background:#fff;border-radius:20px;padding:5px 13px;box-shadow:2px 2px 0 var(--ink);
  margin-bottom:12px;user-select:none}
.stamp{width:88px;height:88px;border:3.5px solid var(--red);border-radius:50%;color:var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transform:rotate(-13deg);position:relative;font-family:var(--serif);flex:none}
.stamp::after{content:'';position:absolute;inset:5px;border:1.5px solid var(--red);border-radius:50%}
.stamp b{font-size:21px;letter-spacing:3px;font-weight:900}
.stamp i{font-size:8.5px;font-style:normal;letter-spacing:1px;opacity:.85}
.stamp.pu{border-color:var(--purple);color:var(--purple)}
.stamp.pu::after{border-color:var(--purple)}
.stamp.ink{border-color:var(--ink);color:var(--ink)}
.stamp.ink::after{border-color:var(--ink)}
.stampdrop{animation:stampdrop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampdrop{0%{transform:rotate(-13deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-13deg) scale(1)}}
.marquee{overflow:hidden;white-space:nowrap;border:1.5px solid var(--ink);border-radius:8px;
  background:#fff;font-size:11px;padding:5px 0}
.marquee span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite;font-family:var(--din)}
@keyframes mq{to{transform:translateX(-100%)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.empty{border:2px dashed var(--gray);border-radius:14px;padding:26px 16px;text-align:center;color:var(--gray)}
.empty .big{font-size:34px;margin-bottom:8px}
/* ============ tab1 急救站 ============ */
.bigaid{margin:18px 0 14px;text-align:center}
.bigaid .btn{padding:26px 16px;font-size:23px;letter-spacing:2px;border-radius:18px}
.aidstats{display:flex;gap:10px;margin-bottom:14px}
.aidstats .ticket{flex:1;text-align:center;padding:13px 6px}
.aidstats .v{font-family:var(--din);font-size:22px;font-weight:700}
.weekbar{display:flex;gap:6px}
.weekbar .d{flex:1;text-align:center;border:1.5px solid var(--ink);border-radius:9px;background:#fff;padding:7px 0 6px;position:relative}
.weekbar .d.today{box-shadow:2px 2px 0 var(--purple);border-color:var(--purple)}
.weekbar .d b{display:block;font-size:10px;color:var(--gray);font-weight:600}
.weekbar .d .dot{width:22px;height:22px;margin:3px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.dot.hold{background:var(--neon)}.dot.bought{background:var(--red);color:#fff}.dot.both{background:linear-gradient(135deg,var(--neon) 49%,var(--red) 51%);color:#fff}
/* ============ tab2 预言机大厅 ============ */
.pred-item{display:flex;gap:11px;align-items:stretch;margin-bottom:11px;cursor:pointer}
.pred-item .face{width:52px;flex:none;border:2px solid var(--ink);border-radius:12px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:3px 3px 0 var(--ink)}
.pred-item .body{flex:1;padding:11px 12px}
.pred-item .t{font-weight:800;font-size:14.5px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.pred-item .p{font-family:var(--din);color:var(--purple);font-size:13px}
.pred-item .sub{font-size:11px;color:var(--gray);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.cd{font-family:var(--din);font-weight:700;color:var(--red)}
/* ============ detail ============ */
.bigcd{font-family:var(--din);font-size:34px;font-weight:800;text-align:center;color:var(--purple);letter-spacing:1px}
.voteline{display:flex;align-items:center;gap:9px;border:1.5px solid var(--ink);border-radius:11px;
  background:#fff;padding:9px 11px;margin-bottom:8px}
.voteline .f{font-size:20px}
.voteline .who{font-weight:700;font-size:13px;min-width:44px}
.voteline .say{flex:1;font-size:12px;color:#444}
.voteline .vtag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;flex:none}
.v0{background:#ffe3e3;color:var(--red)}.v1{background:#e6f9c8;color:#3c7a00}.v2{background:#eee9fb;color:var(--purple)}
/* ============ aid flow ============ */
.breathwrap{margin:24px auto 8px;width:216px;height:216px;border-radius:50%;position:relative;
  background:conic-gradient(var(--neon) calc(var(--p)*1%),#e6e0d2 0);display:flex;align-items:center;justify-content:center}
.breathwrap::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.breathball{width:150px;height:150px;border-radius:50%;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#9b73e8,var(--purple) 72%);color:#fff;box-shadow:0 10px 26px rgba(108,59,209,.5)}
.breathball b{font-size:52px;font-family:var(--din)}
.breathball i{font-style:normal;font-size:12px;letter-spacing:3px;opacity:.9}
.convert .cbox{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px 14px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline;box-shadow:3px 3px 0 rgba(21,21,21,.15)}
.convert .cbox .k{font-size:12px;color:var(--gray);font-weight:700}
.convert .cbox .v{font-family:var(--din);font-size:20px;font-weight:800;color:var(--purple)}
.zacopy{border-left:4px solid var(--red);background:#fff;padding:10px 12px;font-size:13.5px;line-height:1.7;border-radius:0 10px 10px 0}
/* ============ reveal ============ */
.stage-r{background:linear-gradient(180deg,var(--purple-d),var(--purple));border:2px solid var(--ink);
  border-radius:14px;padding:22px 16px 18px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.stage-r .vtitle{font-family:var(--serif);font-size:40px;letter-spacing:6px;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.stage-r .vline{font-size:13px;opacity:.95;margin-top:8px;line-height:1.7}
.hero-choices{display:flex;gap:10px;margin:10px 0}
.hero{flex:1;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:13px 6px;text-align:center;
  cursor:pointer;box-shadow:3px 3px 0 var(--ink);user-select:none}
.hero.on{background:var(--purple);color:#fff}
.hero .e{font-size:24px}.hero .t{font-size:12.5px;font-weight:700;margin-top:4px}
/* ============ cards for share ============ */
.share-card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink)}
.share-card .band{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.share-card .band .bn{font-family:var(--serif);font-size:15px;letter-spacing:2px;font-weight:900}
.share-card .band .be{font-family:var(--din);font-size:10px;letter-spacing:2px;opacity:.85}
.share-card .cbody{padding:15px 16px}
.sc-item{font-family:var(--serif);font-size:21px;font-weight:900;line-height:1.4}
.sc-price{font-family:var(--din);font-size:34px;font-weight:800;color:var(--purple)}
.sc-quote{border-left:4px solid var(--neon);background:#fff;border-radius:0 9px 9px 0;
  padding:9px 11px;font-size:12.5px;color:#333;margin-top:10px;line-height:1.6}
.opts3{display:flex;gap:8px;margin-top:12px}
.opts3 .o{flex:1;border:1.5px solid var(--ink);border-radius:10px;padding:8px 4px;text-align:center;background:#fff}
.opts3 .o b{display:block;font-size:12px}
.opts3 .o .n{font-family:var(--din);font-weight:800;color:var(--red)}
.sc-foot{border-top:2px dashed rgba(21,21,21,.3);padding:9px 16px;display:flex;justify-content:space-between;align-items:center}
.sc-foot .l{font-size:9.5px;color:var(--gray);line-height:1.5}
.barcode{display:flex;gap:1.5px;align-items:stretch;height:26px}
.barcode i{width:2px;background:var(--ink)}
.barcode i.w{width:4px}
/* ============ ring ============ */
.ring{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.ring .rv{position:relative;z-index:1;text-align:center}
.ring .rv b{font-family:var(--din);font-size:24px}
.ring .rv i{display:block;font-style:normal;font-size:9px;color:var(--gray)}
/* ============ modal / export ============ */
.modal{position:absolute;inset:0;background:rgba(12,10,20,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .mbox{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;max-height:100%;
  overflow-y:auto;padding:16px;width:100%;box-shadow:6px 6px 0 #000}
.modal img{width:100%;border:2px solid var(--ink);border-radius:10px;display:block;background:#fff}
/* ============ misc ============ */
.section-t{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 9px}
.section-t .h2::before{content:'■ ';color:var(--purple);font-size:11px}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:12.5px;padding:9px 16px;border-radius:22px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:86%;text-align:center}
.toast.show{opacity:.96}
.curdiv{position:absolute;inset:0;z-index:12;background:var(--purple);transform:translateX(101%);pointer-events:none}
.curdiv.run{animation:cur .62s ease both}
@keyframes cur{0%{transform:translateX(101%)}45%{transform:translateX(0)}100%{transform:translateX(-101%)}}
.mini-stats{display:flex;gap:9px}
.mini-stats .ms{flex:1;border:1.5px solid var(--ink);border-radius:11px;background:#fff;text-align:center;padding:9px 4px}
.mini-stats .ms b{font-family:var(--din);font-size:18px;display:block}
.mini-stats .ms i{font-style:normal;font-size:10px;color:var(--gray)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar"><span class="num">9:41</span><span class="brand">🔮 ORACLE · 7</span><span>📶 <span class="num">87</span>%</span></div>
  <div class="screens">
    <section class="screen" id="s-aid"></section>
    <section class="screen" id="s-hall"></section>
    <section class="screen" id="s-me"></section>
    <section class="screen" id="s-aidflow"></section>
    <section class="screen" id="s-aidcard"></section>
    <section class="screen" id="s-create"></section>
    <section class="screen" id="s-card"></section>
    <section class="screen" id="s-vote"></section>
    <section class="screen" id="s-detail"></section>
    <section class="screen" id="s-reveal"></section>
  </div>
  <nav class="tabbar" id="tabbar">
    <div class="tab on" data-tab="s-aid"><span class="ico">🚑</span>急救站</div>
    <div class="tab" data-tab="s-hall"><span class="ico">🔮</span>预言机</div>
    <div class="tab" data-tab="s-me"><span class="ico">🏅</span>预言家</div>
  </nav>
  <div class="toast" id="toast"></div>
  <div id="modal-root"></div>
  <div class="curdiv" id="curdiv"></div>
</div>
<script>
'use strict';
window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(String(m)+'@'+l);};
window.addEventListener('unhandledrejection',function(e){window.__errors.push('promise:'+e.reason);});

/* ================= brand & data ================= */
var BRAND={name:'消费预言机',en:'ORACLE OF REGRET',sub:'7 天后见',
  tagline:'你的下一次冲动消费,让朋友来预言',
  disc:'仅供娱乐,不构成任何建议'};

var CHIPS=['说能缓解疲劳,但我已经有 3 个了','双 11 不买就亏了','最近太累了,奖励一下自己','这价格真的很少见','下次就不一定有了','别人都有了'];
var SASS=['你上一次也是这么说的','你的退货记录不会说谎','它在吃灰方面很有天赋','钱没了可以再赚,快乐没了就真没了','7 天后的你正在找退货入口','我预言你连运费险都用得上'];
var FACES=[{n:'老赵',e:'🐻'},{n:'阿May',e:'🧣'},{n:'Kiki',e:'🌟'},{n:'小雨',e:'🌿'},{n:'表姐',e:'🦊'},{n:'小北',e:'🐧'}];
var SENS=['去死','傻','蠢','废','滚','垃圾'];

var KEY='oracle_prophet_v1';
function seedA(){var t=Date.now();
  return{id:'NO.'+String(t).slice(-6),item:'筋膜枪 · 某网红同款',price:399,
  reason:'说能缓解肩颈,但我已经有 3 个按摩仪了',mine:0,createdAt:t-86400e3*8,
  deadline:t-86400e3*1,ffwd:false,status:'done',demo:true,
  votes:[{name:'老赵',face:'🐻',choice:0,reason:'你上一次也是这么说的'},
         {name:'Kiki',face:'🌟',choice:0,reason:'你的退货记录不会说谎'},
         {name:'小雨',face:'🌿',choice:1,reason:'钱没了可以再赚,快乐没了就真没了'},
         {name:'表姐',face:'🦊',choice:2,reason:'你根本不会买,你在等人拦你'}],
  result:{bought:true,regret:true}};}
function seedB(){var t=Date.now();
  return{id:'NO.'+String(t-1).slice(-6),item:'盲盒同好会 · 隐藏款',price:219,
  reason:'最后一只,错过就不再有了',mine:0,createdAt:t-86400e3*1,
  deadline:t+86400e3*6,ffwd:false,status:'open',demo:true,
  votes:[{name:'阿May',face:'🧣',choice:0,reason:'它在吃灰方面很有天赋'},
         {name:'小北',face:'🐧',choice:1,reason:'喜欢就买,开心就好'}],
  result:null};}
function fresh(){return{settings:{salary:8000,tea:15,rentDay:100},
  aid:{saved:0,hold:0,bought:0,streak:0,last:'',today:{date:'',amt:0},week:{}},
  preds:[seedA(),seedB()],seeded:true};}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function loadState(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  var s=fresh();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}return s;}
var state=loadState();

/* ================= utils ================= */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clean(s){SENS.forEach(function(w){s=s.split(w).join('※');});return s;}
function money(n){return '¥'+Math.round(n).toLocaleString('zh-CN');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function weekKey(){var d=new Date().getDay();return d===0?7:d;}
function fmtDate(ts){var d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function cdText(deadline){var ms=deadline-Date.now();
  if(ms<=0)return '已到开奖时间';
  var h=Math.floor(ms/3600e3),d=Math.floor(h/24),h2=h%24,m=Math.floor(ms%3600e3/60e3);
  if(d>=1)return '剩 '+d+' 天 '+h2+' 时';
  if(h2>=1)return '剩 '+h2+' 时 '+m+' 分';
  return '剩 '+m+' 分钟';}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},1900);}
function choiceTag(c){return c===0?'会后悔':(c===1?'不会后悔':'根本不会买');}
function choiceCls(c){return 'v'+c;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

function touchStreak(){var a=state.aid,t=todayStr();
  if(a.last!==t){a.streak=(a.last===yesterdayStr())?a.streak+1:1;a.last=t;}
}
function yesterdayStr(){var d=new Date(Date.now()-86400e3);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function weekRecord(){var a=state.aid,k=String(weekKey());
  if(!a.week[k])a.week[k]={amt:0,hold:0,bought:0};return a.week[k];}

var breathT=null;
function runBreath(){var n=6;clearInterval(breathT);
  var setP=function(p){var r=$('#breathRing');if(r)r.style.setProperty('--p',p);};
  setP(0);
  breathT=setInterval(function(){
    n--;var bn=$('#bnum'),bl=$('#blab'),r=$('#breathRing');
    if(!bn){clearInterval(breathT);return;}
    if(n<=0){clearInterval(breathT);aidCtx.step='amount';renderAidFlow();return;}
    bn.textContent=n;bl.textContent=(n>3?'吸气':'呼气');
    setP((6-n)/6*100);
  },1000);}

function hitCount(p){var r=p.result;if(!r)return 0;
  return p.votes.filter(function(v){return judgeHit(v.choice,r.bought,r.regret);}).length;}
function judgeHit(c,bought,regret){
  if(c===0)return bought&&regret;
  if(c===1)return !bought||(bought&&!regret);
  return !bought;}

function oracleStats(){
  var done=state.preds.filter(function(p){return p.status==='done'&&p.result;});
  var v=0,h=0,st=0,sh=0;var map={};
  done.forEach(function(p){
    p.votes.forEach(function(x){v++;
      if(judgeHit(x.choice,p.result.bought,p.result.regret)){h++;if(!map[x.name])map[x.name]={v:0,h:0};map[x.name].v++;map[x.name].h++;}
      else{if(!map[x.name])map[x.name]={v:0,h:0};map[x.name].v++;}
    });
    st++;if(judgeHit(p.mine,p.result.bought,p.result.regret))sh++;
  });
  var best=null,bh=0;
  Object.keys(map).forEach(function(k){if(map[k].h>bh&&map[k].v>=1){bh=map[k].h;best={n:k,v:map[k].v,h:map[k].h};}});
  var acc=v?h/v:0;
  var title=acc>=.8?'赛博预言家':acc>=.6?'人间清醒':acc>=.4?'民间观察员':(v?'翻车体质':'新手上路');
  return{v:v,h:h,acc:acc,st:st,sh:sh,title:title,best:best,done:done.length};}

  +    '</div>'
  +    '<div class="stamp pu" style="width:64px;height:64px"><b style="font-size:14px;letter-spacing:1px">'+(accPct>=80?'封神':accPct>=60?'清醒':'观望')+'</b><i style="font-size:7px">ARCHIVE</i></div>'
  +  '</div>'
  +  '<div class="divider"></div>'
  +  '<div class="row" style="gap:10px">'
  +    '<div class="btn sm" style="flex:1" data-act="saveOracle">📸 保存预言家卡</div>'
  +  '</div>'
  +'</div>'
  +'<div class="section-t"><span class="h2">急救战绩</span><span class="note">与预言机共用钱包</span></div>'
  +'<div class="mini-stats">'
  +  '<div class="ms"><b style="color:var(--red)">'+money(a.saved)+'</b><i>累计救回</i></div>'
  +  '<div class="ms"><b>'+a.hold+'</b><i>按住次数</i></div>'
  +  '<div class="ms"><b>'+(a.hold+a.bought?Math.round(a.hold/(a.hold+a.bought)*100):0)+'%</b><i>按住率</i></div>'
  +  '<div class="ms"><b>'+a.streak+'</b><i>连续天数</i></div>'
  +'</div>'
  +'<div class="section-t"><span class="h2">清醒换算设置</span><span class="note">本机保存</span></div>'
  +'<div class="ticket">'
  +  '<div class="row" style="gap:10px">'
  +    '<div class="field" style="flex:1;margin:0"><label>月薪 ¥</label><input id="setSalary" type="number" min="1" value="'+state.settings.salary+'"></div>'
  +    '<div class="field" style="flex:1;margin:0"><label>奶茶 ¥/杯</label><input id="setTea" type="number" min="1" value="'+state.settings.tea+'"></div>'
  +    '<div class="field" style="flex:1;margin:0"><label>房租 ¥/天</label><input id="setRent" type="number" min="1" value="'+state.settings.rentDay+'"></div>'
  +  '</div>'

  $('#s-me').innerHTML=html;};
function saveSettings(){var s=state.settings;
  var a=parseFloat(($('#setSalary')||{}).value||'0'),b=parseFloat(($('#setTea')||{}).value||'0'),c=parseFloat(($('#setRent')||{}).value||'0');
  if(a>0)s.salary=Math.round(a);if(b>0)s.tea=Math.round(b);if(c>0)s.rentDay=Math.round(c);
  saveState();toast('换算参数已保存');}
function clearDemo(){state.preds=state.preds.filter(function(p){return !p.demo;});saveState();
  toast('演示样本已清空');rerender();}

/* ================= canvas 导出 ================= */
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrapText(c,text,x,y,maxW,lh){text=String(text);var line='',lines=[];
  for(var i=0;i<text.length;i++){if(c.measureText(line+text[i]).width>maxW&&line){lines.push(line);line=text[i];}else line+=text[i];}
  if(line)lines.push(line);lines.forEach(function(l,i){c.fillText(l,x,y+i*lh);});return lines.length;}
function drawStamp(c,x,y,txt,color){c.save();c.translate(x,y);c.rotate(-13*Math.PI/180);
  c.strokeStyle=color;c.lineWidth=6;c.beginPath();c.arc(0,0,66,0,Math.PI*2);c.stroke();
  c.lineWidth=2.5;c.beginPath();c.arc(0,0,55,0,Math.PI*2);c.stroke();
  c.fillStyle=color;c.font='900 34px "Songti SC","SimSun",serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText(txt,0,-6);c.font='11px "Consolas",monospace';c.fillText('VERDICT',0,26);c.restore();}
function drawFoot(c,W,H){c.fillStyle='#8A857A';c.font='18px sans-serif';c.textAlign='left';
  c.fillText('搜索「消费预言机」,来当预言家',44,H-64);
  c.fillText('仅供娱乐 · 不构成任何建议 · 无二维码',44,H-38);
  c.fillStyle='#151515';for(var i=0;i<32;i++){var bw=i%3===0?5:2.5;c.fillRect(W-206+i*4.6,H-84,bw,52);}}
function frame(c,W,H,bandColor,title,en){
  c.fillStyle='#F6F1E4';c.fillRect(0,0,W,H);
  c.strokeStyle='#151515';c.lineWidth=8;c.strokeRect(18,18,W-36,H-36);
  c.lineWidth=2.5;c.strokeRect(32,32,W-64,H-64);
  var g=c.createLinearGradient(0,54,W,54);g.addColorStop(0,'#4B2694');g.addColorStop(1,bandColor);
  c.fillStyle=g;c.fillRect(44,54,W-88,86);
  c.fillStyle='#fff';c.font='900 42px "Songti SC","SimSun",serif';c.textAlign='left';c.textBaseline='alphabetic';
  c.fillText(title,66,116);c.font='600 17px "Consolas",monospace';c.globalAlpha=.9;
  c.textAlign='right';c.fillText(en,W-66,110);c.globalAlpha=1;}
function exportCard(kind){
  var W=780,H=1040;var cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var c=cv.getContext('2d');c.textBaseline='alphabetic';
  if(kind==='predict'){
    var p=getPred(curPred);if(!p)return;
    frame(c,W,H,'#6C3BD1',BRAND.name,'7-DAY PREDICTION');
    c.fillStyle='#151515';c.font='24px sans-serif';c.textAlign='left';
    c.fillText(p.id+' · 已封存',66,190);
    c.textAlign='right';c.fillText('OPEN: '+fmtDate(p.deadline),W-66,190);
    c.textAlign='left';c.font='900 52px "Songti SC","SimSun",serif';
    var ln=wrapText(c,p.item,66,268,W-132,60);
    c.font='800 76px "Bahnschrift","Consolas",sans-serif';c.fillStyle='#6C3BD1';
    c.fillText(money(p.price),66,268+ln*60+78);
    if(p.reason){c.fillStyle='#151515';c.font='28px sans-serif';
      c.fillText('当时说:',66,268+ln*60+140);
      c.font='30px sans-serif';c.fillStyle='#333';
      wrapText(c,'「'+p.reason+'」',66,268+ln*60+184,W-132,44);}
    var n=[0,0,0];p.votes.forEach(function(v){n[v.choice]++;});
    c.font='900 30px "Songti SC","SimSun",serif';c.fillStyle='#151515';
    c.fillText('预言分布 · 已收 '+p.votes.length+' 票',66,H-190);
    var total=Math.max(p.votes.length,1),bx=66,bw=(W-132-24)/3;
    [['会后悔',n[0],'#D62828'],['不会后悔',n[1],'#C8F31D'],['根本不会买',n[2],'#6C3BD1']].forEach(function(d,i){
      var x=bx+i*(bw+12);c.fillStyle='#fff';c.strokeStyle='#151515';c.lineWidth=3;
      c.fillRect(x,H-168,bw,74);c.strokeRect(x,H-168,bw,74);
      c.fillStyle='#151515';c.font='24px sans-serif';c.textAlign='center';
      c.fillText(d[0],x+bw/2,H-138);c.font='800 32px "Consolas",monospace';
      c.fillStyle=d[2]==='#C8F31D'?'#3c7a00':d[2];c.fillText(d[1],x+bw/2,H-104);});
    drawStamp(c,W-150,470,'封存','#6C3BD1');
    drawFoot(c,W,H);
  }else if(kind==='verdict'){
    var p=getPred(curPred);if(!p||!p.result)return;
    var kindV=verdictKind(p);
    var meta={face:{t:'打脸卡',bg:'#D62828',st:'应验',en:'CALLED IT'},
      xiang:{t:'真香卡',bg:'#69A81C',st:'翻车',en:'NO REGRETS'},
      hold:{t:'守住了卡',bg:'#6C3BD1',st:'清醒',en:'SAVED'}}[kindV];
    frame(c,W,H,meta.bg,meta.t,meta.en);
    var r=p.result,hits=hitCount(p),tot=p.votes.length;
    c.textAlign='center';c.font='140px sans-serif';c.fillStyle='#151515';
    c.fillText(meta.t==='打脸卡'?'🤡':(meta.t==='真香卡'?'😋':'🛡️'),W/2,290);
    c.font='900 64px "Songti SC","SimSun",serif';c.fillStyle=meta.bg==='#D62828'?'#B31F1F':(meta.bg==='#69A81C'?'#3C7A00':'#4B2694');
    c.fillText(meta.t,W/2,392);
    c.font='30px sans-serif';c.fillStyle='#333';
    wrapText(c,esc(p.item)+' · '+money(p.price)+' · 预言家命中 '+hits+'/'+tot,W/2,446,W-200,42);
    var hitVotes=p.votes.filter(function(v){return judgeHit(v.choice,r.bought,r.regret);});
    var top=hitVotes.length?hitVotes[0].reason:(p.votes[0]?p.votes[0].reason:'');
    if(top){c.textAlign='left';c.font='28px sans-serif';c.fillStyle='#151515';
      c.fillText('神预言:',66,530);c.font='30px sans-serif';c.fillStyle='#333';
      wrapText(c,'「'+top+'」',66,574,W-132,44);}
    drawStamp(c,W-160,760,meta.st,meta.bg==='#69A81C'?'#3C7A00':meta.bg);
    c.textAlign='left';c.font='900 30px "Songti SC","SimSun",serif';c.fillStyle='#151515';
    c.fillText('7 天,一句预言,一场开奖。',66,H-160);
    drawFoot(c,W,H);
  }else if(kind==='saved'){
    frame(c,W,H,'#D62828','劫后余生卡','SELF-RESCUE');
    var a2=state.aid;
    c.textAlign='center';c.fillStyle='#8A857A';c.font='26px sans-serif';
    c.fillText('今天,你从冲动手里救回了',W/2,300);
    c.font='800 110px "Bahnschrift","Consolas",sans-serif';c.fillStyle='#D62828';
    c.fillText(money(aidCtx.price||0),W/2,430);
    c.font='28px sans-serif';c.fillStyle='#151515';
    c.fillText('连续急救 '+a2.streak+' 天 · 累计救回 '+money(a2.saved),W/2,505);
    c.font='34px "Songti SC","SimSun",serif';c.fillStyle='#151515';
    wrapText(c,'「你不是想买它,你只是现在需要一个出口。」',W/2,600,W-220,52);
    drawStamp(c,W-160,800,'按住','#151515');
    c.textAlign='left';c.font='900 30px "Songti SC","SimSun",serif';c.fillStyle='#151515';
    c.fillText('冲动来了,先按 6 秒。',66,H-160);
    drawFoot(c,W,H);
  }else{
    var s=oracleStats(),accPct=Math.round(s.acc*100);
    frame(c,W,H,'#6C3BD1','预言家卡','ORACLE ARCHIVE');
    c.beginPath();c.strokeStyle='#151515';c.lineWidth=3;
    c.arc(W/2,330,110,0,Math.PI*2);c.stroke();
    c.beginPath();c.strokeStyle='#6C3BD1';c.lineWidth=22;
    c.arc(W/2,330,110,-Math.PI/2,-Math.PI/2+Math.PI*2*(s.acc||0));c.stroke();
    c.textAlign='center';c.fillStyle='#151515';c.font='800 58px "Bahnschrift","Consolas",sans-serif';
    c.fillText(accPct+'%',W/2,346);c.font='20px sans-serif';c.fillStyle='#8A857A';c.fillText('命中率',W/2,382);
    c.font='900 54px "Songti SC","SimSun",serif';c.fillStyle='#151515';
    c.fillText('「'+s.title+'」',W/2,520);
    c.font='30px sans-serif';c.fillStyle='#333';
    c.fillText('预言 '+s.st+' 场 · 朋友投票 '+s.v+' 次 · 命中 '+s.h+' 次',W/2,580);
    if(s.best)c.fillText('最懂你的人: '+s.best.n+' ('+s.best.h+'/'+s.best.v+')',W/2,626);
    drawStamp(c,W-160,800,s.acc>=.8?'封神':(s.acc>=.6?'清醒':'观望'),'#6C3BD1');
    c.textAlign='left';c.font='900 30px "Songti SC","SimSun",serif';c.fillStyle='#151515';
    c.fillText('朋友对你的判断,是关系资产。',66,H-160);
    drawFoot(c,W,H);
  }
  showExport(cv);}
function showExport(cv){
  var url=cv.toDataURL('image/png');
  var root=$('#modal-root');
  root.innerHTML='<div class="modal" data-act="mClose"><div class="mbox" data-stop="1">'
  +'<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="h2">卡片已生成</span><span class="tag ne">长按或下载</span></div>'
  +'<img src="'+url+'" alt="分享卡">'
  +'<div class="btn sm pu" data-act="dlPng" style="margin-top:12px">⬇️ 下载 PNG</div>'
  +'<div class="note" style="margin-top:8px;text-align:center">小程序版将走 wx.canvasToTempFilePath + 相册授权</div>'
  +'</div></div>';
  root.querySelector('img').setAttribute('data-url',url);}
function mClose(e){var t=(e&&e.target)?e.target:null;
  if(t&&t.closest&&t.closest('[data-stop]'))return;
  $('#modal-root').innerHTML='';}
function dlPng(){var img=$('#modal-root img');if(!img)return;
  var a=document.createElement('a');a.href=img.getAttribute('data-url');
  a.download='oracle-card.png';document.body.appendChild(a);a.click();a.remove();
  toast('已下载(浏览器);分享零奖励');}

/* ================= tab & event wiring ================= */
$$('#tabbar .tab').forEach(function(t){t.addEventListener('click',function(){
  go(t.getAttribute('data-tab'),function(){rerender();});});});
document.addEventListener('click',function(e){
  if(!e||!e.target||!e.target.closest)return;
  var closer=e.target.closest('[data-act]');
  if(!closer)return;
  var act=closer.getAttribute('data-act'),v=closer.getAttribute('data-v');
  if(act==='mClose'){mClose(e);return;}
  var acts={
    aidStart:aidStart,aidQuit:aidQuit,aidSkip:function(){clearInterval(breathT);aidCtx.step='amount';renderAidFlow();},
    aidConvert:aidConvert,aidBack:aidBack,aidHold:aidHold,aidBought:aidBought,aidPredict:aidPredict,
    aidHome:aidHome,boughtPredict:boughtPredict,saveShot:function(){exportCard('saved');},
    goCreate:goCreate,pickReason:function(){pickReason(v);},pickMine:function(){pickMine(v);},makePred:makePred,
    cardBack:cardBack,saveCard:function(){exportCard(curPred&&getPred(curPred)&&getPred(curPred).status==='done'?'verdict':'predict');},
    copyShare:copyShare,goVote:function(){go('s-vote',function(){rerender();});},voteBack:voteBack,
    castVote:function(){castVote(v,closer.getAttribute('data-name'),closer.getAttribute('data-face'));},
    voteSass:function(){voteSassPick(v);},simFriends:simFriends,
    openPred:function(){openPred(closer.getAttribute('data-id'));},detailBack:detailBack,
    remindMe:remindMe,ffwd:ffwd,goReveal:function(){go('s-reveal',function(){rerender();});},
    revealBack:revealBack,rvBought:function(){rvBought(v);},rvRegret:function(){rvRegret(v);},doReveal:doReveal,
    saveOracle:function(){exportCard('oracle');},saveSettings:saveSettings,clearDemo:clearDemo,
    createBack:createBack,mClose:mClose,dlPng:dlPng
  };
  if(acts[act])acts[act](v,closer);
});
/* ================= countdown ticker ================= */
setInterval(function(){
  $$('.cd').forEach(function(el){var dl=+el.getAttribute('data-dl');
    if(dl)el.textContent=cdText(dl);});
},1000);

/* ================= debug api & boot ================= */
window.__oracle={state:function(){return state;},go:go,errors:window.__errors,exportCard:exportCard};
go('s-aid',function(){rerender();});
</script>
